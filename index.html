}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;hatchpath-robot&#x27;);
      const buttons = [...root.querySelectorAll(&#x27;[data-stage]&#x27;)];
      const states = {
        patrol: {
          falseLight: false, riskRoute: false, safeRoute: false, shieldOpen: false,
          status: &#x27;Патруль: камера пассивно наблюдает разрешённый участок; экран сложен.&#x27;,
          detail: &#x27;Робот не использует свет, чтобы направлять черепашек.&#x27;
        },
        detect: {
          falseLight: true, riskRoute: true, safeRoute: false, shieldOpen: false,
          status: &#x27;Риск найден: ML видит, что траектория ведёт к ложному источнику света.&#x27;,
          detail: &#x27;Система сопоставляет курс черепашки, направление океана и карту освещённости.&#x27;
        },
        shield: {
          falseLight: true, riskRoute: true, safeRoute: false, shieldOpen: true,
          status: &#x27;Экран развёрнут: он перекрывает прямую засветку со стороны суши.&#x27;,
          detail: &#x27;В реальном применении положение экрана и дистанцию утверждает специалист по охране природы.&#x27;
        },
        confirm: {
          falseLight: true, riskRoute: false, safeRoute: true, shieldOpen: true,
          status: &#x27;Путь подтверждён: робот отслеживает безопасное направление к воде и фиксирует событие.&#x27;,
          detail: &#x27;После этого он передаёт на карту проблему с освещением для постоянного исправления.&#x27;
        }
      };
      const setVisible = (id, visible) =&gt; {
        const item = root.querySelector(`#${id}`);
        item.classList.toggle(&#x27;is-hidden&#x27;, !visible);
        item.classList.toggle(&#x27;is-visible&#x27;, visible);
      };
      const update = stage =&gt; {
        const s = states[stage];
        setVisible(&#x27;false-light&#x27;, s.falseLight);
        setVisible(&#x27;risk-route&#x27;, s.riskRoute);
        setVisible(&#x27;safe-route&#x27;, s.safeRoute);
        setVisible(&#x27;direction-arrow&#x27;, s.safeRoute);
        setVisible(&#x27;shield-open&#x27;, s.shieldOpen);
        setVisible(&#x27;shield-folded&#x27;, !s.shieldOpen);
        root.querySelector(&#x27;#stage-status&#x27;).textContent = s.status;
        root.querySelector(&#x27;#stage-detail&#x27;).textContent = s.detail;
        buttons.forEach(button =&gt; {
          const selected = button.dataset.stage === stage;
          button.setAttribute(&#x27;aria-pressed&#x27;, String(selected));
          button.classList.toggle(&#x27;btn-primary&#x27;, selected);
        });
      };
      buttons.forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; update(button.dataset.stage)));
      update(&#x27;patrol&#x27;);
    })();
  &lt;/script&gt;

  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;

  let skipDelayUntil = 0;

      .then(({ x, y }) =&gt; {

  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);

      return;
    }

    if (activeTrigger === trigger) {

    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
